        <div class="slide" id="slide2">
            <h1 class="valyrian-title">📸 Galeri Kenangan</h1>
            <div class="subtitle">Momen indah yang telah kita lalui bersama</div>

            <div class="gallery-grid">
                <div class="gallery-item"><img src="foto1.jpg" alt="Kenangan 1"></div>
                <div class="gallery-item"><img src="foto2.jpg" alt="Kenangan 2"></div>
                <div class="gallery-item"><img src="foto3.jpg" alt="Kenangan 3"></div>
                <div class="gallery-item"><img src="foto4.jpg" alt="Kenangan 4"></div>
                <div class="gallery-item"><img src="foto5.jpg" alt="Kenangan 5"></div>
                <div class="gallery-item"><img src="foto6.jpg" alt="Kenangan 6"></div>
                <div class="gallery-item"><img src="foto7.jpg" alt="Kenangan 7"></div>
            </div>

            <div>
                <button class="btn btn-secondary" onclick="nextSlide(1)">⬅ Kembalikan</button>
            </div>
        </div>

    </div>

    <script>
        function nextSlide(slideNumber) {
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            document.getElementById('slide' + slideNumber).classList.add('active');
        }
    </script>
</body>
